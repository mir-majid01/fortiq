name: Fortiq CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fortiq-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fortiq
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: |
          mapfile -t tests < <(find test -name '*_test.dart' ! -name 'goldens_test.dart' -print)
          flutter test --reporter expanded "${tests[@]}"

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify APK rights and integrity
        run: python ../.github/scripts/verify_apk.py build/app/outputs/flutter-apk/app-debug.apk

      - name: Calculate SHA-256
        run: sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/app-debug.apk.sha256

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: fortiq-debug-apk
          path: |
            fortiq/build/app/outputs/flutter-apk/app-debug.apk
            fortiq/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  publish-stable-release:
    needs: verify-and-build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLIC_RELEASE_APPROVED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: fortiq-debug-apk
          path: release-assets

      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git tag -l --format='%(contents)' "$RELEASE_TAG" > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Fortiq %s\n' "$RELEASE_TAG" > release-notes.md
          fi
          gh release create "$RELEASE_TAG" \
            release-assets/app-debug.apk \
            release-assets/app-debug.apk.sha256 \
            --title "Fortiq $RELEASE_TAG" \
            --notes-file release-notes.md
