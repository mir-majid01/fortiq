<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Base preview</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position:absolute;inset:0;overflow:hidden;background:{{g2}}">
<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" aria-hidden="true">
<defs><radialGradient id="bpg" cx="50%" cy="52%" r="75%"><stop offset="0" stop-color="{{g1}}"></stop><stop offset="1" stop-color="{{g2}}"></stop></radialGradient></defs>
<rect width="100" height="100" fill="url(#bpg)"></rect>
<sc-for list="{{trees}}" as="tr" hint-placeholder-count="8">
<g><circle cx="{{tr.x}}" cy="{{tr.sy}}" r="{{tr.r}}" fill="rgba(0,0,0,.28)"></circle><circle cx="{{tr.x}}" cy="{{tr.y}}" r="{{tr.r}}" fill="{{tc}}"></circle><circle cx="{{tr.hx}}" cy="{{tr.hy}}" r="{{tr.hr}}" fill="rgba(255,255,255,.12)"></circle></g>
</sc-for>
<polygon points="{{slabL}}" fill="{{slab1}}"></polygon>
<polygon points="{{slabR}}" fill="{{slab2}}"></polygon>
<polygon points="{{slabTop}}" fill="{{slabTopC}}"></polygon>
<polygon points="{{grass}}" fill="{{grassC}}"></polygon>
<sc-for list="{{walls}}" as="w" hint-placeholder-count="3">
<g fill="none" stroke-linejoin="round">
<polyline points="{{w.p0}}" stroke="rgba(20,16,8,.55)" stroke-width="1.1"></polyline>
<polyline points="{{w.p1}}" stroke="#a89f84" stroke-width="1"></polyline>
<polyline points="{{w.p2}}" stroke="#e8e1c9" stroke-width=".7"></polyline>
</g>
</sc-for>
<sc-for list="{{blds}}" as="b" hint-placeholder-count="30">
<g>
<polygon points="{{b.left}}" fill="{{b.c1}}"></polygon>
<polygon points="{{b.right}}" fill="{{b.c2}}"></polygon>
<polygon points="{{b.top}}" fill="{{b.c0}}" stroke="rgba(255,255,255,.25)" stroke-width=".2"></polygon>
</g>
</sc-for>
</svg>
<div style="position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.38) 100%)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"seed":{"editor":"int","default":1,"min":1,"max":99,"section":"Preview"},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    const seed = Number(this.props.seed ?? 1) || 1;
    let st = (seed * 7919 + 12345) % 233280;
    const rnd = () => { st = (st * 9301 + 49297) % 233280; return st / 233280; };
    const k = 0.66, oy = 53;
    const P = (x, y, z = 0) => [50 + (x - y) * k, oy + (x + y) * k * 0.5 - z];
    const f = (a) => a.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const dn = (p, d) => [p[0], p[1] + d];
    const themes = [
      { g1: '#46663a', g2: '#273b20', tree: '#2c4a25', top: '#5f8a3f', slabTop: '#8a7650', s1: '#6b5a3a', s2: '#4d4029' },
      { g1: '#6a5d40', g2: '#352d1f', tree: '#4d5a30', top: '#7d7048', slabTop: '#a48e60', s1: '#7a6644', s2: '#574830' },
      { g1: '#8fa2b2', g2: '#4f6070', tree: '#4a6a55', top: '#c6d3de', slabTop: '#9fb0be', s1: '#7f93a4', s2: '#5d7080' },
      { g1: '#35493f', g2: '#17231e', tree: '#223a2d', top: '#47664f', slabTop: '#6d6a52', s1: '#554f3c', s2: '#3b372a' }
    ];
    const T = themes[seed % 4];
    const pals = [
      ['#b4c0d0', '#8693a6', '#667385'],
      ['#b4c0d0', '#8693a6', '#667385'],
      ['#dab468', '#ad8744', '#86642f'],
      ['#9db088', '#74875f', '#586a47'],
      ['#cf7a68', '#a15548', '#7d4036'],
      ['#c2baa8', '#908a7a', '#6f6a5e']
    ];
    const items = [];
    const box = (gx, gy, s, h, c) => {
      const b = [P(gx, gy), P(gx + s, gy), P(gx + s, gy + s), P(gx, gy + s)];
      const t = [P(gx, gy, h), P(gx + s, gy, h), P(gx + s, gy + s, h), P(gx, gy + s, h)];
      return { depth: gx + gy + s, top: f(t), left: f([b[3], b[2], t[2], t[3]]), right: f([b[1], b[2], t[2], t[1]]), c0: c[0], c1: c[1], c2: c[2] };
    };
    for (let i = -3; i <= 3; i++) {
      for (let j = -3; j <= 3; j++) {
        if (i === 0 && j === 0) continue;
        if (rnd() < 0.3) continue;
        const s = 4.2 + rnd() * 2.6;
        const gx = i * 9 - s / 2 + (rnd() - 0.5) * 1.6;
        const gy = j * 9 - s / 2 + (rnd() - 0.5) * 1.6;
        items.push(box(gx, gy, s, 2 + rnd() * 3.2, pals[Math.floor(rnd() * pals.length)]));
      }
    }
    items.push(box(-4.5, -4.5, 9, 6.5, pals[2]));
    items.sort((a, b) => a.depth - b.depth);
    const walls = [13.5, 22.5, 31.5].map((a) => {
      const ring = (z) => f([P(-a, -a, z), P(a, -a, z), P(a, a, z), P(-a, a, z), P(-a, -a, z)]);
      return { p0: ring(0), p1: ring(0.8), p2: ring(1.6) };
    });
    const sq = (a, z = 0) => [P(-a, -a, z), P(a, -a, z), P(a, a, z), P(-a, a, z)];
    const slab = sq(38);
    const trees = [];
    for (let n = 0; n < 40 && trees.length < 16; n++) {
      const x = rnd() * 100, y = rnd() * 100;
      if (Math.abs(x - 50) / 47 + Math.abs(y - 53) / 25 < 1.2) continue;
      const r = 1.8 + rnd() * 2.2;
      trees.push({ x: x.toFixed(1), y: y.toFixed(1), sy: (y + r * 0.6).toFixed(1), r: r.toFixed(1), hx: (x - r * 0.3).toFixed(1), hy: (y - r * 0.3).toFixed(1), hr: (r * 0.45).toFixed(1) });
    }
    return {
      g1: T.g1, g2: T.g2, tc: T.tree, trees, walls, blds: items,
      slabL: f([slab[3], slab[2], dn(slab[2], 3), dn(slab[3], 3)]),
      slabR: f([slab[1], slab[2], dn(slab[2], 3), dn(slab[1], 3)]),
      slabTop: f(slab), grass: f(sq(36)),
      slab1: T.s1, slab2: T.s2, slabTopC: T.slabTop, grassC: T.top
    };
  }
}
</script>
</body>
</html>
