<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Explore</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif}
button{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0B0D10;color:#F2F4F7">
<div style="position:absolute;inset:0;padding:56px 20px 0;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">

<span style="font-family:'Manrope',sans-serif;font-size:24px;font-weight:800">Explore</span>

<label style="display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;background:#171C23;border:1px solid rgba(255,255,255,.06);box-sizing:border-box;color:#929BA8">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<span style="font-size:14px">Search bases, creators, tags</span>
</label>

<div style="display:flex;gap:8px;margin:0 -20px;padding:0 20px;overflow:hidden">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="7">
<span style="flex:none;height:34px;padding:0 14px;border-radius:999px;background:{{c.bg}};color:{{c.fg}};border:1px solid {{c.bd}};font-size:13px;font-weight:600;display:flex;align-items:center">{{c.l}}</span>
</sc-for>
</div>

<div style="display:flex;align-items:center;justify-content:space-between">
<span style="font-size:13px;color:#929BA8;font-variant-numeric:tabular-nums">86 bases</span>
<div style="display:flex;gap:8px">
<button style="height:34px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#171C23;color:#F2F4F7;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px">Top rated
<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<button style="height:34px;padding:0 12px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:#171C23;color:#F2F4F7;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filters
<span style="min-width:16px;height:16px;border-radius:8px;background:rgba(214,168,79,.18);color:#D6A84F;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">3</span></button>
</div>
</div>

<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px">
<sc-for list="{{res}}" as="b" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;gap:8px">
<div style="position:relative;height:166px;border-radius:14px;overflow:hidden;background:#171C23;border:1px solid rgba(255,255,255,.06)">
<dc-import name="BasePreview" seed="{{b.seed}}" hint-size="100%,166px"></dc-import>
<span style="position:absolute;left:8px;top:8px;height:22px;padding:0 8px;border-radius:6px;background:rgba(11,13,16,.8);font-size:11px;font-weight:700;color:#D6A84F;display:flex;align-items:center">{{b.th}}</span>
<button aria-label="Favorite" style="position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:9px;border:0;background:rgba(11,13,16,.8);color:{{b.heart}};display:flex;align-items:center;justify-content:center">
<svg width="15" height="15" viewBox="0 0 24 24" fill="{{b.fill}}" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:6px">
<div style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-size:14px;font-weight:600">{{b.name}}</span><span style="font-size:12px;color:#929BA8">{{b.cat}}</span></div>
<span style="display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#F2F4F7;font-variant-numeric:tabular-nums">
<svg width="11" height="11" viewBox="0 0 24 24" fill="#D6A84F" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.2 6.5 20.2l1-6.2L3 9.6l6.2-.9z"></path></svg>{{b.r}}</span>
</div>
</div>
</sc-for>
<div style="display:flex;flex-direction:column;gap:8px" aria-label="Loading">
<div style="height:166px;border-radius:14px;background:#171C23"></div>
<div style="height:12px;width:70%;border-radius:6px;background:#171C23"></div>
<div style="height:10px;width:40%;border-radius:5px;background:#11151A"></div>
</div>
<div style="display:flex;flex-direction:column;gap:8px" aria-label="Loading">
<div style="height:166px;border-radius:14px;background:#171C23"></div>
<div style="height:12px;width:60%;border-radius:6px;background:#171C23"></div>
<div style="height:10px;width:34%;border-radius:5px;background:#11151A"></div>
</div>
</div>
</div>

<div style="position:absolute;left:16px;right:16px;top:748px;height:68px;border-radius:20px;background:rgba(23,28,35,.96);border:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-around;padding:0 6px;box-sizing:border-box">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;font-size:11px;font-weight:600;color:{{n.c}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>{{n.label}}<span style="width:4px;height:4px;border-radius:50%;background:{{n.bar}}"></span></div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = (l, active) => ({ l, bg: active ? 'rgba(214,168,79,.1)' : '#171C23', fg: active ? '#D6A84F' : '#F2F4F7', bd: active ? '#D6A84F' : 'rgba(255,255,255,.06)' });
    const nav = [
      ['Home', 'M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],
      ['Explore', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM15.5 8.5l-2 5-5 2 2-5z'],
      ['Collections', 'M4 6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z'],
      ['Community', 'M16 20v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1M10 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM20 20v-1a3.5 3.5 0 0 0-2.5-3.3M15.5 4.3a3.5 3.5 0 0 1 0 6.4'],
      ['Profile', 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0']
    ];
    return {
      chips: [['All', false], ['Home Village', true], ['Builder Base', false], ['War', false], ['Farming', false], ['Trophy', false], ['Ranked', false], ['Hybrid', false], ['Anti 3 Star', false]].map((x) => on(x[0], x[1])),
      res: [
        { seed: 3, name: 'Obsidian Ring', th: 'TH 17', cat: 'War · Anti 3 Star', r: '4.9', heart: '#D6A84F', fill: '#D6A84F' },
        { seed: 8, name: 'Iron Meridian', th: 'TH 17', cat: 'War · Anti 2 Star', r: '4.8', heart: '#F2F4F7', fill: 'none' },
        { seed: 12, name: 'Hollow Crown', th: 'TH 17', cat: 'Legend League', r: '4.8', heart: '#F2F4F7', fill: 'none' },
        { seed: 15, name: 'Ashfall Core', th: 'TH 17', cat: 'Trophy', r: '4.7', heart: '#F2F4F7', fill: 'none' }
      ],
      nav: nav.map((x, i) => ({ label: x[0], d: x[1], c: i === 1 ? '#D6A84F' : '#929BA8', bar: i === 1 ? '#D6A84F' : 'rgba(0,0,0,0)' }))
    };
  }
}
</script>
</body>
</html>
