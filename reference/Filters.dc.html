<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Filters</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif}
button{font-family:inherit}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#050607;color:#F2F4F7">
<div style="position:absolute;left:0;right:0;bottom:0;top:64px;border-radius:20px 20px 0 0;background:#11151A;border-top:1px solid rgba(255,255,255,.08);padding:10px 20px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:20px">
<div style="align-self:center;width:36px;height:4px;border-radius:2px;background:#2A323D"></div>
<div style="display:flex;align-items:center;justify-content:space-between">
<span style="font-family:'Manrope',sans-serif;font-size:20px;font-weight:800">Filters</span>
<button aria-label="Close" style="width:36px;height:36px;border-radius:10px;border:0;background:#171C23;color:#929BA8;display:flex;align-items:center;justify-content:center">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<span style="font-size:12px;font-weight:600;letter-spacing:.1em;color:#929BA8">VILLAGE</span>
<div style="display:flex;padding:3px;border-radius:12px;background:#171C23">
<div style="flex:1;height:38px;border-radius:9px;background:#252D3A;color:#F2F4F7;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center">Home Village</div>
<div style="flex:1;height:38px;border-radius:9px;color:#929BA8;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center">Builder Base</div>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<span style="font-size:12px;font-weight:600;letter-spacing:.1em;color:#929BA8">TOWN HALL</span>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{ths}}" as="c" hint-placeholder-count="8">
<span style="width:56px;height:36px;border-radius:10px;background:{{c.bg}};border:1px solid {{c.bd}};color:{{c.fg}};font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums">{{c.l}}</span>
</sc-for>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<span style="font-size:12px;font-weight:600;letter-spacing:.1em;color:#929BA8">CATEGORY</span>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="7">
<span style="height:34px;padding:0 13px;border-radius:999px;background:{{c.bg}};border:1px solid {{c.bd}};color:{{c.fg}};font-size:13px;font-weight:600;display:flex;align-items:center">{{c.l}}</span>
</sc-for>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<span style="font-size:12px;font-weight:600;letter-spacing:.1em;color:#929BA8">LAYOUT STYLE</span>
<div style="display:flex;flex-wrap:wrap;gap:8px">
<sc-for list="{{styles}}" as="c" hint-placeholder-count="6">
<span style="height:34px;padding:0 13px;border-radius:999px;background:{{c.bg}};border:1px solid {{c.bd}};color:{{c.fg}};font-size:13px;font-weight:600;display:flex;align-items:center">{{c.l}}</span>
</sc-for>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<span style="font-size:12px;font-weight:600;letter-spacing:.1em;color:#929BA8">FRESHNESS</span>
<div style="display:flex;padding:3px;border-radius:12px;background:#171C23">
<sc-for list="{{fresh}}" as="c" hint-placeholder-count="4">
<div style="flex:1;height:36px;border-radius:9px;background:{{c.bg}};color:{{c.fg}};font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center">{{c.l}}</div>
</sc-for>
</div>
</div>

<div style="display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 14px;border-radius:12px;background:#171C23">
<div style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6DAE8B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5"></path></svg>Verified builders only</div>
<div style="width:44px;height:26px;border-radius:13px;background:#6DAE8B;position:relative"><span style="position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#0B0D10"></span></div>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 30px;background:#11151A;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:10px;box-sizing:border-box">
<button style="height:52px;padding:0 22px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:none;color:#F2F4F7;font-size:15px;font-weight:600">Reset</button>
<button style="flex:1;height:52px;border-radius:12px;border:0;background:#D6A84F;color:#14100A;font-size:15px;font-weight:700">Show Results</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = (l, on) => ({ l, bg: on ? 'rgba(214,168,79,.1)' : '#171C23', bd: on ? '#D6A84F' : 'rgba(255,255,255,.06)', fg: on ? '#D6A84F' : '#F2F4F7' });
    return {
      ths: [18, 17, 16, 15, 14, 13].map((n) => p('TH ' + n, n === 17)),
      cats: [['War', true], ['CWL', false], ['Trophy', false], ['Farming', false], ['Hybrid', false], ['Anti 3 Star', true], ['Legend League', false]].map((x) => p(x[0], x[1])),
      styles: [['Box', false], ['Diamond', false], ['Ring', true], ['Island', false], ['Symmetrical', false], ['Asymmetrical', false]].map((x) => p(x[0], x[1])),
      fresh: [['Any', false], ['7 days', true], ['30 days', false], ['Current meta', false]].map((x) => ({ l: x[0], bg: x[1] ? '#252D3A' : 'rgba(0,0,0,0)', fg: x[1] ? '#F2F4F7' : '#929BA8' }))
    };
  }
}
</script>
</body>
</html>
