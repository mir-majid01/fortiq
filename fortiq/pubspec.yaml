name: fortiq
description: "Fortiq — Clash of Clans base discovery, redesigned."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Native launch branding and Base Detail system integrations.
  flutter_native_splash: ^2.4.8
  share_plus: ^10.0.0
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  image: ^4.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/branding/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700

flutter_native_splash:
  color: "#0B0D10"
  color_dark: "#0B0D10"
  image: assets/branding/fortiq_splash.png
  image_dark: assets/branding/fortiq_splash.png
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android_12:
    color: "#0B0D10"
    color_dark: "#0B0D10"
    image: assets/branding/fortiq_splash_android12.png
    image_dark: assets/branding/fortiq_splash_android12.png
